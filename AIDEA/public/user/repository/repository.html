<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="repository.css" />
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">AI</div>
                <div class="logo-text">
                    <h2>AIDEA</h2>
                    <p>Norzagaray College</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <span class="nav-label">MAIN</span>
                    <a href="../dashboard/dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>
                        Dashboard</a>
                    <a href="../profile/my-profile.html" class="nav-item"><span class="nav-icon">👤</span> My
                        Profile</a>
                    <a href="../submit thesis/submit-thesis.html" class="nav-item"><span class="nav-icon">📄</span>
                        Submit Thesis</a>
                    <a href="../my submission/my-submissions.html" class="nav-item"><span class="nav-icon">📋</span> My
                        Submissions</a>
                </div>
                <div class="nav-group">
                    <span class="nav-label">SERVICES</span>
                    <a href="../repository/repository.html" class="nav-item active"><span class="nav-icon">🔍</span>
                        Repository</a>
                    <a href="../avail services/avail-services.html" class="nav-item"><span class="nav-icon">🛠️</span>
                        Avail Services</a>
                    <a href="../payments reciepts/payments-reciepts.html" class="nav-item"><span
                            class="nav-icon">💳</span> Requests & Certificate</a>
                </div>
                <div class="nav-group">
                    <span class="nav-label">EVENTS</span>
                    <a href="../events dashboard/events-dashboard.html" class="nav-item"><span
                            class="nav-icon">📅</span> Events Dashboard</a>
                    <a href="../feedback/my-feedback.html" class="nav-item"><span class="nav-icon">⭐</span> My
                        Feedback</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <a href="../profile/my-profile.html" class="user-card">
                    <div class="user-avatar">JD</div>
                    <div class="user-info">
                        <h4>Juan Dela Cruz</h4>
                        <p>BSCS STUDENT</p>
                    </div>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div>
                    <h1>Repository</h1>
                    <p class="subtitle">Browse published thesis papers</p>
                </div>
                <div class="topbar-right">
                    <span class="status-badge"><span class="dot"></span> Online</span>
                    <button class="btn-signout">Sign Out</button>
                </div>
            </div>

            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="repoSearch" placeholder="Search by title, author, or keyword..." />
            </div>

            <div class="repo-filters">
                <select id="courseFilter">
                    <option value="">All Courses</option>
                    <option>BSHM</option>
                    <option>BSCS</option>
                    <option>BEED</option>
                    <option>BSED</option>
                </select>
                <select id="yearFilter">
                    <option value="">All Years</option>
                    <option>2025</option>
                    <option>2024</option>
                    <option>2023</option>
                </select>
            </div>

            <div class="repo-grid" id="repoGrid"></div>
        </main>
    </div>
    <script src="repository.js"></script>
</body>

</html>
